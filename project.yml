name: Joyflow
options:
  bundleIdPrefix: dev.joyflow
  deploymentTarget:
    macOS: "26.0"
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    ENABLE_APP_SANDBOX: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "5"
  configs:
    Debug:
      ENABLE_HARDENED_RUNTIME: NO
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_STYLE: Manual
      DEVELOPMENT_TEAM: ""
    Release:
      ENABLE_HARDENED_RUNTIME: YES
      CODE_SIGN_IDENTITY: "Developer ID Application"
      CODE_SIGN_STYLE: Manual
      DEVELOPMENT_TEAM: "9F2JXY8TCK"

packages:
  JoyflowKit:
    path: JoyflowKit
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: 0.9.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  Joyflow:
    type: application
    platform: macOS
    sources:
      - path: Joyflow
    dependencies:
      - package: JoyflowKit
        product: JoyflowKit
      - package: ArgmaxOSS
        product: WhisperKit
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_NAME: Joyflow
        PRODUCT_BUNDLE_IDENTIFIER: dev.joyflow.Joyflow
        INFOPLIST_FILE: Joyflow/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        CODE_SIGN_ENTITLEMENTS: Joyflow/Resources/Joyflow.entitlements

  JoyflowiOS:
    type: application
    platform: iOS
    sources:
      - path: JoyflowiOS
    dependencies:
      - package: JoyflowKit
        product: JoyflowKit
    settings:
      base:
        PRODUCT_NAME: Joyflow
        PRODUCT_BUNDLE_IDENTIFIER: dev.joyflow.Joyflow.ios
        INFOPLIST_FILE: JoyflowiOS/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        CODE_SIGN_ENTITLEMENTS: JoyflowiOS/Resources/JoyflowiOS.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES

schemes:
  Joyflow:
    build:
      targets:
        Joyflow: all
  JoyflowiOS:
    build:
      targets:
        JoyflowiOS: all
